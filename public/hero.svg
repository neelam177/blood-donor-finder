<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" fill="none">
  <!-- Blood drop with heart -->
  <g>
    <!-- Main blood drop shape -->
    <path d="M260 100C260 100 180 180 180 260C180 304.183 216.863 340 260 340C303.137 340 340 304.183 340 260C340 180 260 100 260 100Z" fill="#DC2626" opacity="0.1"/>
    <path d="M260 120C260 120 200 190 200 260C200 293.137 226.863 320 260 320C293.137 320 320 293.137 320 260C320 190 260 120 260 120Z" fill="#DC2626"/>
    
    <!-- Heart inside -->
    <path d="M260 210C260 210 245 195 230 195C220 195 215 205 215 215C215 235 260 270 260 270C260 270 305 235 305 215C305 205 300 195 290 195C275 195 260 210 260 210Z" fill="white"/>
    
    <!-- Donor card -->
    <g transform="translate(140, 360)">
      <rect x="0" y="0" width="240" height="100" rx="12" fill="white" stroke="#DC2626" stroke-width="3"/>
      <rect x="15" y="15" width="70" height="70" rx="8" fill="#FEE2E2"/>
      <text x="50" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#DC2626" text-anchor="middle">A+</text>
      <line x1="105" y1="25" x2="215" y2="25" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
      <line x1="105" y1="45" x2="190" y2="45" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
      <line x1="105" y1="65" x2="200" y2="65" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Plus signs decoration -->
    <g fill="#DC2626" opacity="0.2">
      <rect x="380" y="140" width="30" height="6" rx="3"/>
      <rect x="392" y="128" width="6" height="30" rx="3"/>
      
      <rect x="100" y="220" width="24" height="5" rx="2.5"/>
      <rect x="110" y="210" width="5" height="24" rx="2.5"/>
      
      <rect x="420" y="280" width="20" height="4" rx="2"/>
      <rect x="428" y="272" width="4" height="20" rx="2"/>
    </g>
    
    <!-- Circles decoration -->
    <circle cx="90" cy="150" r="8" fill="#DC2626" opacity="0.15"/>
    <circle cx="430" cy="350" r="12" fill="#DC2626" opacity="0.15"/>
    <circle cx="400" cy="80" r="6" fill="#DC2626" opacity="0.15"/>
